<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf5f3">
  <title>WhatsApp 客戶服務中心</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; color: #10182b; }
    body { margin: 0; min-height: 100svh; background: linear-gradient(125deg, #edf6f2, #edf3f5); display: grid; place-items: center; padding: 63px 24px 56px; }
    .card { width: min(780px, 100%); padding: 60px 42px 57px; border-radius: 50px; background: rgba(255,255,255,.97); box-shadow: 0 32px 65px rgba(31,52,59,.11); text-align: center; }
    .badge { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 24px; border-radius: 40px; background: #ecfdf5; color: #10863c; font-size: 22px; font-weight: 750; }
    .badge-dot { width: 12px; height: 12px; border-radius: 50%; background: #92e6b6; }
    .phone-ring { width: 210px; height: 210px; margin: 0 auto; border: 4px solid transparent; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .phone-ring::before, .phone-ring::after { content: ""; position: absolute; inset: -4px; border: 4px solid #b8f1d0; border-radius: 50%; animation: ripple 3.2s ease-out infinite; pointer-events: none; }
    .phone-ring::after { animation-delay: -1.6s; }
    .phone { display: grid; place-items: center; width: 138px; height: 138px; border-radius: 50%; background: #1fcf60; }
    .phone svg { width: 70px; height: 70px; fill: white; }
    h1 { margin: 3px -18px 0; font-size: clamp(28px, 4.9vw, 48px); font-weight: 850; line-height: 1.45; letter-spacing: -.8px; }
    h1 span { color: #1ecf60; }
    .subtitle { margin: 20px 0 49px; color: #6a7d99; font-size: 24px; line-height: 1.5; letter-spacing: -.5px; }
    .status { padding: 33px 20px 32px; min-height: 200px; border: 1px solid #dee6f1; border-radius: 27px; background: #f7f9fc; }
    .status h2 { margin: 0; color: #166b36; font-size: 32px; line-height: 1.5; font-weight: 800; }
    .status p { margin: 12px 0 24px; min-height: 1.4em; font-size: 23px; color: #697d99; line-height: 1.4; }
    .dots { display: flex; align-items: center; justify-content: center; gap: 15px; height: 16px; }
    .dots i { display: block; width: 14px; height: 14px; background: #29d36b; border-radius: 50%; animation: loading 1.5s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; }
    .dots i:nth-child(3) { animation-delay: .4s; }
    .location { margin: 32px 0 39px; color: #6b7e99; font-size: 23px; line-height: 1.5; }
    .location span { font-size: 20px; margin-right: 8px; }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .feature { background: #f7f9fb; border-radius: 23px; padding: 21px 8px 23px; }
    .feature strong { display: block; font-size: 32px; line-height: 1.4; font-weight: 800; color: #10863c; }
    .feature span { display: block; color: #6a7e9a; font-size: 18px; margin-top: 10px; }
    footer { border-top: 1px solid #e1e7ee; margin-top: 41px; padding-top: 26px; color: #91a4c1; font-size: 19px; line-height: 1.6; }
    footer .lock { font-size: 18px; margin-right: 6px; }
    .contact { display: none; margin: 20px auto 0; width: fit-content; background: #13853f; color: white; padding: 12px 24px; border-radius: 100px; text-decoration: none; font-weight: 700; }
    .contact:focus-visible { outline: 3px solid #142f22; outline-offset: 4px; }
    .contact:hover { background: #0d6d32; }
    @keyframes ripple { 0% { transform: scale(.69); opacity: 0; } 15% { opacity: .8; } 100% { transform: scale(1.24); opacity: 0; } }
    @keyframes loading { 0%, 70%, 100% { transform: scale(.55); opacity: .5; } 35% { transform: scale(1); opacity: 1; } }
    /* Desktop proportions match the full-page reference; phones use their own spacing below. */
    body { min-height: 100vh; min-height: 100svh; padding: 40px 24px; background: radial-gradient(ellipse at 100% 0%, #d6f2e7 0, transparent 28%), radial-gradient(ellipse at 0% 100%, #dcefea 0, transparent 25%), linear-gradient(125deg, #edf6f2, #edf3f7); }
    .card { width: min(624px, 100%); min-width: 0; padding: 48px 34px 32px; border-radius: 40px; }
    .badge { min-height: 42px; padding: 8px 19px; gap: 9px; font-size: 18px; }
    .badge-dot { width: 10px; height: 10px; }
    .phone-ring { width: 168px; height: 168px; }
    .phone { width: 110px; height: 110px; }
    .phone svg { width: 56px; height: 56px; }
    h1 { margin: 3px -16px 0; font-size: 38px; letter-spacing: -1px; }
    h1 span { white-space: nowrap; }
    .subtitle { font-size: 20px; margin: 16px 0 38px; }
    .status { min-height: 160px; padding: 26px 16px; border-radius: 22px; }
    .status h2 { font-size: 26px; }
    .status p { font-size: 18px; margin: 10px 0 18px; }
    .dots { gap: 10px; height: 13px; }
    .dots i { width: 12px; height: 12px; }
    .location { font-size: 18px; margin: 26px 0 31px; }
    .location span { font-size: 16px; }
    .features { gap: 14px; }
    .feature { padding: 17px 6px 18px; border-radius: 18px; min-width: 0; }
    .feature strong { font-size: 26px; }
    .feature span { font-size: 14px; margin-top: 8px; }
    footer { margin-top: 32px; padding-top: 21px; font-size: 15px; }
    footer .lock { font-size: 14px; }
    @media (max-width: 600px) {
      body { padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
      .card { max-width: 420px; padding: 27px 20px 22px; border-radius: 28px; box-shadow: 0 18px 45px rgba(31,52,59,.1); }
      .badge { font-size: 15px; min-height: 38px; padding: 8px 15px; gap: 8px; }
      .badge-dot { width: 9px; height: 9px; }
      .phone-ring { width: 146px; height: 146px; border-width: 3px; margin-top: 8px; margin-bottom: 10px; }
      .phone { width: 98px; height: 98px; }
      .phone svg { width: 50px; height: 50px; }
      h1 { margin: 0 -4px; font-size: clamp(22px, 5.6vw, 26px); line-height: 1.45; letter-spacing: -.5px; text-wrap: balance; }
      .subtitle { font-size: 15px; margin: 12px 0 24px; }
      .status { min-height: 140px; padding: 22px 8px; border-radius: 20px; }
      .status h2 { font-size: 23px; }
      .status p { font-size: 15px; margin: 9px 0 18px; }
      .location { font-size: 16px; margin: 21px 0; }
      .features { gap: 9px; }
      .feature { padding: 15px 4px; border-radius: 16px; }
      .feature strong { font-size: 23px; }
      .feature span { font-size: 12px; margin-top: 6px; }
      footer { margin-top: 23px; padding-top: 17px; font-size: 12px; }
    }
    @media (max-width: 600px) and (max-height: 740px) {
      .card { padding-top: 20px; padding-bottom: 18px; }
      .phone-ring { width: 122px; height: 122px; margin-top: 5px; margin-bottom: 7px; }
      .phone { width: 84px; height: 84px; }
      .phone svg { width: 44px; height: 44px; }
      .subtitle { margin-bottom: 18px; }
      .status { min-height: 128px; padding-top: 18px; padding-bottom: 18px; }
      .location { margin: 16px 0; }
      .feature { padding-top: 12px; padding-bottom: 12px; }
      footer { margin-top: 18px; padding-top: 14px; }
    }
    @media (max-width: 350px) {
      .card { padding-left: 14px; padding-right: 14px; }
      .badge { font-size: 14px; }
      .subtitle, .status p { font-size: 14px; }
    }
    body { height: 100vh; height: 100dvh; min-height: 0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .phone-ring::after { display: none; } }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <div class="badge"><span class="badge-dot" aria-hidden="true"></span>WhatsApp 客戶服務中心</div>
    <div class="phone-ring" aria-hidden="true"><div class="phone">
      <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.15 15.15 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg>
    </div></div>
    <h1 id="title">正在接入 <span>WhatsApp</span> 客服熱線</h1>
    <p class="subtitle">幫助中心·人工服務·緊急諮詢</p>
    <section class="status" aria-label="連線狀態演示">
      <h2 id="status-title">正在建立連線</h2>
      <p id="status-description">系統正在分配可用客服專員。</p>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <a class="contact" id="contact" target="_blank" rel="noopener noreferrer">開啟 WhatsApp 聯絡客服</a>
    </section>
    <p class="location"><span aria-hidden="true">📍</span>客戶服務中心</p>
    <div class="features" aria-label="服務特色">
      <div class="feature"><strong>24/7</strong><span>全天服務</span></div>
      <div class="feature"><strong>SSL</strong><span>加密連線</span></div>
      <div class="feature"><strong>即時</strong><span>線上支援</span></div>
    </div>
    <footer><span class="lock" aria-hidden="true">🔒</span><span id="footer-text">加密通話 · 安全連線 · 無需跳轉</span></footer>
  </main>
  <script>
    // Fit the complete card to the visible viewport; zoom also scales its layout box.
    // Content stays visible rather than being clipped by overflow: hidden.
    const card = document.querySelector(".card");
    function fitCardToViewport() {
      const bodyStyle = getComputedStyle(document.body);
      const availableWidth = document.body.clientWidth - parseFloat(bodyStyle.paddingLeft) - parseFloat(bodyStyle.paddingRight);
      const availableHeight = document.body.clientHeight - parseFloat(bodyStyle.paddingTop) - parseFloat(bodyStyle.paddingBottom);
      card.style.width = Math.min(availableWidth, window.innerWidth <= 600 ? 420 : 624) + "px";
      const scale = Math.min(1, Math.max(1, availableHeight - 2) / card.offsetHeight);
      card.style.zoom = String(scale);
    }
    fitCardToViewport();
    window.addEventListener("resize", fitCardToViewport);
    window.visualViewport?.addEventListener("resize", fitCardToViewport);
    new ResizeObserver(fitCardToViewport).observe(card);
    document.fonts.ready.then(fitCardToViewport);
    // 填入完整國際區號及電話號碼，僅限數字，不包含 + 或空格。
    // 留空時展示參考圖的連線動畫，不會建立真實連線。
    const WHATSAPP_NUMBER = "";
    const GREETING = "您好，我需要客服協助。";
    if (/^[1-9]\d{6,14}$/.test(WHATSAPP_NUMBER)) {
      const link = document.getElementById("contact");
      link.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(GREETING);
      link.style.display = "block";
      document.getElementById("status-title").textContent = "聯絡客服";
      document.getElementById("status-description").textContent = "點擊下方按鈕，前往 WhatsApp 開始對話。";
      document.querySelector(".dots").hidden = true;
      document.querySelector(".dots").style.display = "none";
      document.getElementById("title").innerHTML = '透過 <span>WhatsApp</span> 聯絡客服';
      document.getElementById("footer-text").textContent = "點擊按鈕將開啟 WhatsApp";
    } else {
      const messages = [
        "系統正在分配可用客服專員。",
        "正在建立安全通訊連線。",
        "請稍候，正在為您接通客服。"
      ];
      const description = document.getElementById("status-description");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let messageIndex = 0;
      window.setInterval(() => {
        if (document.hidden) return;
        messageIndex = (messageIndex + 1) % messages.length;
        description.textContent = messages[messageIndex];
        if (!reducedMotion.matches) {
          description.animate([
            { opacity: 0, transform: "translateY(4px)" },
            { opacity: 1, transform: "translateY(0)" }
          ], { duration: 400, easing: "ease-out" });
        }
      }, 3000);
    }
  </script>
  <script>
    window.$zoho = window.$zoho || {};
    window.$zoho.salesiq = window.$zoho.salesiq || { ready: function () {} };
  </script>
  <script id="zsiqscript" src="https://salesiq.zohopublic.com/widget?wc=siqb65fbee6ac71ec4dd79161405cd3c7bfc6e19e0eee029e280ffa5eb9c935eb72" defer></script>
</body>
</html>
